name: ytrack-dev

services:
  tools:
    build: ./tools
    # Сид ходит в общий YouTrack машины по его адресу на хосте
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      # YOUTRACK_ADMIN_LOGIN общего YouTrack
      - path: ${YOUTRACK_DEV:?YOUTRACK_DEV — каталог общего YouTrack, см. .env.example}/.env
    environment:
      # У голого uid нет домашнего каталога
      HOME: /tmp
      # Адрес не подставляется из окружения: YOUTRACK_URL хоста может вести в рабочий YouTrack
      YOUTRACK_URL: http://localhost:8091
      YOUTRACK_TOKEN_FILE: /admin/admin-token
      YOUTRACK_STATE_DIR: /state
    volumes:
      - ./tools/src:/work/src:ro
      - ${YOUTRACK_DEV}/.state:/admin:ro
      - ./.state:/state
    working_dir: /work
